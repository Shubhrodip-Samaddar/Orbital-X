<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital Debris Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="view">
      <canvas id="c"></canvas>
      <div id="hud">
        <b id="badge">● LIVE</b>
        <span id="status">Loading…</span>
        <span id="clock"></span>
        <button id="live">Go live</button>
        <label>Speed
          <select id="speed">
            <option value="1" selected>1×</option>
            <option value="60">60×</option>
            <option value="600">600×</option>
            <option value="3600">3600×</option>
          </select>
        </label>
      </div>
      <div id="legend"></div>
    </div>
    <aside>
      <h1>Orbital Debris Tracker</h1>
      <canvas id="map" width="640" height="320" title="Ground track (white line = next orbit of the selected object)"></canvas>
      <input id="q" placeholder="Search name or NORAD ID">
      <ul id="list"></ul>
      <canvas id="mc" title="Illustrative 3D model (not to scale)"></canvas>
      <section id="info">Click an object in the 3D view or the list to see its details.</section>
    </aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.1.3/satellite.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
